# Free-tier demo deployment on Render (Blueprint).
# Runs the API with the notifier inside the same container (free plans have no
# background workers). The scheduler is not run, so tracked items are not
# re-checked automatically and no price-drop alerts are sent.
services:
  - type: web
    name: skrap-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Restart the notifier if it exits; uvicorn stays the main process Render monitors.
    dockerCommand: >-
      sh -c "(while true; do python -m app.jobs.notifier; sleep 5; done) &
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      # Not "production": that profile requires Paddle billing config, which the demo skips.
      # The production-only safety defaults are set explicitly below instead.
      - key: ENVIRONMENT
        value: demo
      - key: SERVER_FETCH_RESOLVE_DNS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRACKING_DATABASE_URL
        sync: false
      - key: TRACKING_DB_POOL_MAX_SIZE
        value: "5"
      - key: SCHEDULER_QUEUE_REDIS_URL
        fromService:
          type: keyvalue
          name: skrap-redis
          property: connectionString
      # Frontend origin, e.g. https://skrap-ui.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      # e.g. https://skrap-ui.vercel.app/api/auth/jwks
      - key: BETTER_AUTH_JWKS_URL
        sync: false
      # e.g. https://skrap-ui.vercel.app
      - key: BETTER_AUTH_JWT_ISSUER
        sync: false
      # This service's own URL, e.g. https://skrap-api.onrender.com
      - key: BETTER_AUTH_JWT_AUDIENCE
        sync: false
      - key: BETTER_AUTH_JWT_ALGORITHMS
        value: EdDSA
      # Allow a slow JWKS fetch while the frontend function cold-starts.
      - key: BETTER_AUTH_JWKS_TIMEOUT_SECONDS
        value: "10"
      # Telegram bot from @BotFather; the bot username is resolved from the token.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Must match the secret_token registered with Telegram's setWebhook.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: skrap-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
